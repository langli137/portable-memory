[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-memory"
version = "0.1.0"
description = "Local, cross-editor long-term memory service with MCP + REST interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
pmem = "portable_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
